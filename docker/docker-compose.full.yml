services:
  # ─────────────────────────────────────────────
  # Kuromatsu Agent (one-shot query) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml run --rm kuromatsu-agent -m "Hello"
  # ─────────────────────────────────────────────
  kuromatsu-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: kuromatsu-agent-full
    profiles:
      - agent
    volumes:
      - ./data:/root/.kuromatsu
      - kuromatsu-npm-cache:/root/.npm # npm cache for faster MCP server installs
    entrypoint: ["kuromatsu", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # Kuromatsu Gateway (Long-running Bot) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml --profile gateway up
  # ─────────────────────────────────────────────
  kuromatsu-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: kuromatsu-gateway-full
    restart: unless-stopped
    profiles:
      - gateway
    volumes:
      # Config, security file and workspace (sessions, memory, logs).
      # The first run creates them here and exits; add a model, then start again.
      - ./data:/root/.kuromatsu
      # NPM cache for faster MCP server installs
      - kuromatsu-npm-cache:/root/.npm

volumes:
  kuromatsu-npm-cache: # Cache npm packages to speed up MCP server installations
