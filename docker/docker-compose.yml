services:
  # ─────────────────────────────────────────────
  # Kuromatsu Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm kuromatsu-agent -m "Hello"
  # ─────────────────────────────────────────────
  kuromatsu-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kuromatsu:latest
    container_name: kuromatsu-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.picoclaw
    entrypoint: ["kuromatsu", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # Kuromatsu Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  kuromatsu-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kuromatsu:latest
    container_name: kuromatsu-gateway
    restart: unless-stopped
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.picoclaw
