<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">How Kuromatsu spends its budget</title><desc id="desc">Every message goes through a zero-token reflex, a focus window that loads only what the turn needs, the in-process Bonsai-1.7B model with KV prefix caching, and an external model only when it pays off. In the background: quiet cron routines, runstate and memguard, nightly sleep consolidation and per-turn telemetry.</desc><rect width="1200" height="760" fill="#C7C7C5"/><text x="64" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3" fill="#2B2B29">ONE BINARY · TWO LANES</text><text x="64" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#111111">How Kuromatsu spends its budget</text><line x1="64" y1="160" x2="1136" y2="160" stroke="#111111" stroke-width="2"/><text x="64" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="2" fill="#2B2B29">EVERY MESSAGE</text><text x="640" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="2" fill="#2B2B29">IN THE BACKGROUND</text><line x1="610" y1="190" x2="610" y2="710" stroke="#111111" stroke-width="1.5" stroke-dasharray="4 6"/><polygon points="75,242 86,248 86,261 75,267 64,261 64,248" fill="none" stroke="#111111" stroke-width="2.5"/><text x="104" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#111111">Reflex</text><text x="104" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">Regex match → instant reply. 0 tokens.</text><line x1="75" y1="270" x2="75" y2="360" stroke="#111111" stroke-width="2"/><polygon points="75,364 86,370 86,383 75,389 64,383 64,370" fill="none" stroke="#111111" stroke-width="2.5"/><text x="104" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#111111">Focus window</text><text x="104" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">Only the tools, skills and memory</text><text x="104" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">this turn needs.</text><line x1="75" y1="392" x2="75" y2="482" stroke="#111111" stroke-width="2"/><polygon points="75,486 86,492 86,505 75,511 64,505 64,492" fill="#111111" stroke="#111111" stroke-width="2.5"/><text x="104" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#111111">Bonsai-1.7B, in the binary</text><text x="104" y="536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">1-bit GGUF via llama.cpp (cgo). KV prefix</text><text x="104" y="564" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">cache reused across turns.</text><line x1="75" y1="514" x2="75" y2="604" stroke="#111111" stroke-width="2"/><polygon points="75,608 86,614 86,627 75,633 64,627 64,614" fill="none" stroke="#111111" stroke-width="2.5"/><text x="104" y="626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#111111">External model, when it pays</text><text x="104" y="658" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">Any OpenAI/Ollama-compatible API.</text><text x="104" y="686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">Credentials masked on the way out.</text><polygon points="651,242 662,248 662,261 651,267 640,261 640,248" fill="none" stroke="#111111" stroke-width="2.5"/><text x="680" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#111111">Routines</text><text x="680" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">Cron command jobs: silent when OK,</text><text x="680" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">one LLM turn only on anomaly.</text><polygon points="651,364 662,370 662,383 651,389 640,383 640,370" fill="none" stroke="#111111" stroke-width="2.5"/><text x="680" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#111111">Runstate + memguard</text><text x="680" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">Bitmask state; memory guard reads</text><text x="680" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">the real cgroup limit and PSI.</text><polygon points="651,486 662,492 662,505 651,511 640,505 640,492" fill="none" stroke="#111111" stroke-width="2.5"/><text x="680" y="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#111111">Sleep</text><text x="680" y="536" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">Nightly memory consolidation</text><text x="680" y="564" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">on the external model.</text><polygon points="651,608 662,614 662,627 651,633 640,627 640,614" fill="none" stroke="#111111" stroke-width="2.5"/><text x="680" y="626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#111111">Telemetry</text><text x="680" y="658" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">Tokens, cache and latency per turn</text><text x="680" y="686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#2B2B29">in SQLite → /stats.</text></svg>