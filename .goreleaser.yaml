# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2

project_name: kuromatsu

git:
  ignore_tags:
    - nightly
    - ".*-nightly.*"

builds:
  - &build_base
    id: kuromatsu
    env:
      - CGO_ENABLED=0
    tags:
      - goolm
      - stdjson
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/andre25costa-code/kuromatsu/pkg/config.Version={{ .Version }}
      - -X github.com/andre25costa-code/kuromatsu/pkg/config.GitCommit={{ .ShortCommit }}
      - -X github.com/andre25costa-code/kuromatsu/pkg/config.BuildTime={{ .Date }}
      - -X github.com/andre25costa-code/kuromatsu/pkg/config.GoVersion={{ with index .Env "GOVERSION" }}{{ . }}{{ else }}unknown{{ end }}
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - riscv64
      - loong64
      - arm
      - s390x
    goarm:
      - "6"
      - "7"
    main: ./cmd/kuromatsu
    # Besides invalid pairs, skip targets the pure-Go SQLite driver
    # (modernc.org/libc) has no port for: they fail to compile.
    ignore:
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: riscv64
      - goos: netbsd
        goarch: arm64
      - goos: netbsd
        goarch: s390x
      - goos: netbsd
        goarch: mips64
      - goos: netbsd
        goarch: arm

  # Termux: a GOOS=android binary finds the system CA roots and avoids the
  # syscalls Android's seccomp filter kills a GOOS=linux binary for. Only
  # android/arm64 links without cgo. Separate id so nfpms/dockers (which
  # select ids: [kuromatsu]) never package it.
  - <<: *build_base
    id: kuromatsu-android
    goos:
      - android
    goarch:
      - arm64

dockers_v2:
  - id: kuromatsu
    dockerfile: docker/Dockerfile.goreleaser
    extra_files:
      - docker/entrypoint.sh
    ids:
      - kuromatsu
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kuromatsu"
      - 'docker.io/{{ .Env.DOCKERHUB_IMAGE_NAME }}'
    tags:
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}{{ .Tag }}{{ end }}'
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/riscv64

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - kuromatsu
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: kuromatsu
    ids:
      - kuromatsu
    package_name: kuromatsu
    file_name_template: >-
      {{ .PackageName }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else if eq .Arch "arm" }}armv{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}
    vendor: kuromatsu
    homepage: https://github.com/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kuromatsu
    maintainer: kuromatsu contributors
    description: kuromatsu - a tool for managing and running tasks
    license: MIT
    formats:
      - rpm
      - deb
    bindir: /usr/bin

# Fixed, version-less name so installers and `kuromatsu update` can find it.
# The native (llama.cpp) archive is built outside goreleaser by the release
# workflow into dist-native/; it is checksummed and uploaded with the rest.
checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./dist-native/*.tar.gz

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# upx:
#    - enabled: true
#      compress: best
#      lzma: true

release:
  disable: '{{ isEnvSet "NIGHTLY_BUILD" }}'
  extra_files:
    - glob: ./dist-native/*.tar.gz
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
