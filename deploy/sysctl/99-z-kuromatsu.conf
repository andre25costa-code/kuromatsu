# Kuromatsu — ajustes de kernel para 1GB de RAM com zram (ADR-013/017)
# Nome escolhido para ordenar (lexicograficamente) DEPOIS de qualquer
# /etc/sysctl.d/99-*.conf pré-existente (ex.: 99-servidor.conf, tuning
# antigo de quando esta VM não era exclusiva do Kuromatsu) — arquivos
# sysctl.d são aplicados em ordem de nome de arquivo, o último vence por
# chave. Não edite/apague o arquivo antigo; esta é a forma de sobrepor
# sem tocar em algo que não é nosso.
# Aplicar: sudo cp deploy/sysctl/99-z-kuromatsu.conf /etc/sysctl.d/ && sudo sysctl --system

# zram já ativo como swap nesta VM (zstd, ~993MB) — preferir comprimir heap
# ocioso a descartar o page cache do mmap do modelo (default era 10, ruim
# aqui: descartava justamente as paginas do GGUF sob pressao).
vm.swappiness=100

# Sem read-ahead agressivo em swap comprimido (zram nao é HDD).
vm.page-cluster=0

# Menos agressivo em derrubar dentries/inodes cacheados (custa pouca RAM,
# evita re-stat/re-open repetidos do workspace/sessões).
vm.vfs_cache_pressure=50

# overcommit_memory=1 (já o padrão observado) — deixado explícito para não
# depender do default da imagem; o Go GC e o cgo alocam de forma que picos
# transitórios não devem ser recusados por um heurístico conservador.
vm.overcommit_memory=1
