# Kuromatsu — limite de disco do journal persistente (Trilho F Fix 7,
# S32/NFR-001). Sem isso, journald pode acumular indefinidamente em
# /var/log/journal, disputando os 24GB livres do disco com backups/updates
# num e2-micro de recursos apertados. 64M é generoso para os volumes de log
# reais desta VM (heartbeat a cada 30-60min, sem tráfego de servidor).
#
# Aplicar:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald/00-kuromatsu.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald

[Journal]
SystemMaxUse=64M
