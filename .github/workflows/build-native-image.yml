name: 🌲 Build Native (nativellm) amd64 Image

# Manual only: this builds the cgo/nativellm image (Bonsai-1.7B embedded via
# llama.cpp), which needs a real C++ toolchain and noticeably more RAM/time
# than the regular pure-Go image built by docker-build.yml. It's not part of
# the release pipeline (S32) -- run it by hand when you need a fresh image
# for the Oracle deploy.
#
# Runs on GitHub's standard amd64 runner -- this is also the real deploy
# target's architecture (the Oracle box turned out to be x86_64, not ARM64
# as first assumed; ADR-012 corrects ADR-011). Same-arch build means no
# cross-toolchain and no QEMU either way; the runner's 16 GB RAM just avoids
# the dev machine's ~8 GB ceiling that OOM-killed this same build locally.
on:
  workflow_dispatch:
    inputs:
      llama_build_jobs:
        description: "cmake parallel build jobs for ggml/llama.cpp"
        required: false
        default: "4"

jobs:
  build:
    name: 🏗️ Build native-amd64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository (with llama.cpp submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🚀 Build image, export as tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.native
          tags: kuromatsu:native-amd64
          build-args: |
            LLAMA_BUILD_JOBS=${{ inputs.llama_build_jobs }}
          outputs: type=docker,dest=/tmp/kuromatsu-native-amd64.tar

      - name: 📦 Compress
        run: gzip /tmp/kuromatsu-native-amd64.tar

      - name: ⬆️ Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuromatsu-native-amd64
          path: /tmp/kuromatsu-native-amd64.tar.gz
          retention-days: 14

      # AC-020-3/FR-020 (ADR-013): the demetrius deploy path runs the binary
      # directly under systemd, no Docker in runtime -- extract the two
      # binaries straight from the image we just built (same layers a manual
      # `docker create` + `docker cp` would read) so a plain scp+systemctl
      # restart never has to unpack the whole image tarball just to get them.
      - name: 📤 Extract raw binaries from the built image
        run: |
          set -euo pipefail
          container_id=$(docker create kuromatsu:native-amd64)
          docker cp "$container_id":/usr/local/bin/kuromatsu /tmp/kuromatsu-native-linux-amd64
          docker cp "$container_id":/usr/local/bin/nativebench /tmp/nativebench-linux-amd64
          docker rm "$container_id" >/dev/null
          chmod +x /tmp/kuromatsu-native-linux-amd64 /tmp/nativebench-linux-amd64
          ls -la /tmp/kuromatsu-native-linux-amd64 /tmp/nativebench-linux-amd64

      - name: ⬆️ Upload raw binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuromatsu-native-binaries-amd64
          path: |
            /tmp/kuromatsu-native-linux-amd64
            /tmp/nativebench-linux-amd64
          retention-days: 14

      # Deploy the image manually (Oracle/Docker path):
      #   scp kuromatsu-native-amd64.tar.gz oracle:~/
      #   ssh oracle 'gunzip -c kuromatsu-native-amd64.tar.gz | docker load'
      #   ssh oracle 'docker compose -f docker/docker-compose.native.yml --profile gateway up -d'
      # Deploy the raw binaries manually (demetrius/systemd path, AC-020-4):
      #   scp kuromatsu-native-linux-amd64 nativebench-linux-amd64 demetrius:/tmp/
      #   ssh demetrius 'sudo install -m755 /tmp/kuromatsu-native-linux-amd64 /opt/kuromatsu/bin/kuromatsu && sudo install -m755 /tmp/nativebench-linux-amd64 /opt/kuromatsu/bin/nativebench && sudo systemctl restart kuromatsu'
